name: Build Android APK

on:
  push:
    paths:
      - 'glass-calculator/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Copy web assets to a clean www directory
      run: |
        cd glass-calculator
        mkdir www
        cp index.html app.js styles.css sw.js manifest.json www/

    - name: Install Dependencies
      run: |
        cd glass-calculator
        npm install

    - name: Initialize Android project
      run: |
        cd glass-calculator
        npx cap add android

    - name: Customize App Icon
      run: |
        cd glass-calculator/android/app/src/main/res
        curl -s -o custom_icon.png "https://img.icons8.com/emoji/512/penguin-emoji.png"
        for dpi in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
          cp custom_icon.png mipmap-$dpi/ic_launcher.png || true
          cp custom_icon.png mipmap-$dpi/ic_launcher_round.png || true
          cp custom_icon.png mipmap-$dpi/ic_launcher_foreground.png || true
        done

    - name: Build APK
      run: |
        cd glass-calculator/android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: GlassCalculator-debug.apk
        path: glass-calculator/android/app/build/outputs/apk/debug/app-debug.apk
